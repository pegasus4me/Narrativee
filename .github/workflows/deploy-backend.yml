name: Backend release checks

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LOCAL_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      OPENAI_API_KEY: test-no-network
      OPENAI_MODEL: gpt-6-luna
      BETTER_AUTH_SECRET: ci-auth-secret-never-use-in-production
      BETTER_AUTH_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm --filter backend check-types
      - name: Unit and isolated workflow tests
        run: pnpm --filter backend test:ci
      - name: Deployment check tests
        run: pnpm test:deploy

  build-container:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          build-args: APP_REVISION=${{ github.sha }}
          tags: narrativee-backend:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
